[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-support-agent"
version = "0.1.0"
description = "A ticket booking customer support agent with REST and MCP interfaces"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "langchain>=0.2,<2",
  "langchain-core>=0.2,<2",
  "langchain-community>=0.2,<1",
  "langchain-text-splitters>=0.2,<2",
  "langchain-chroma>=0.1,<2",
  "langchain-openai>=0.1,<2",
  "langchain-anthropic>=0.1,<2",
  "langchain-ollama>=0.1,<1",
  "langgraph>=0.1,<2",
  "chromadb>=0.5,<2",
  "sentence-transformers>=3,<6",
  "rank-bm25>=0.2,<1",
  "mcp[cli]>=1,<2",
  "chainlit>=1.1,<3",
  "streamlit>=1.35,<2",
  "langfuse>=2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]
documents = ["pypdf>=4,<7", "python-docx>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*", "mock_crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["eval: requires a live LLM and is excluded from normal CI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

llm:
  provider: xai
  model: ""
  temperature: 0
  timeout_seconds: 30
  max_retries: 2
agent:
  max_steps: 8
  request_timeout_seconds: 45
  tool_retries: 2
  memory_path: data/checkpoints.sqlite
  approval_ttl_seconds: 600
guardrails:
  max_message_chars: 2000
  injection_patterns:
    - '(?i)\bignore\s+(?:all\s+)?(?:previous|prior|above)\s+instructions?\b'
    - '(?i)\b(?:reveal|show|print|repeat)\s+(?:the\s+)?(?:system|developer)\s+(?:prompt|instructions?)\b'
    - '(?i)\b(?:bypass|disable|override)\s+(?:your\s+)?(?:rules|safety|guardrails)\b'
    - '(?i)\bignore\s+your\s+rules\s+and\s+refund\s+everything\b'
admin:
  max_upload_bytes: 10485760
  analytics_unresolved_limit: 50
  analytics_top_questions_limit: 10
  escalation_list_limit: 100
retrieval:
  knowledge_dir: knowledge_base
  persist_dir: data/chroma
  embedding_model: BAAI/bge-m3
  reranker_model: BAAI/bge-reranker-v2-m3
  chunk_size: 400
  chunk_overlap: 60
  candidate_count: 8
  result_count: 3
  rrf_k: 60
  min_score: 0.25
api:
  host: 0.0.0.0
  port: 8000
mcp:
  host: 0.0.0.0
  port: 8001
  path: /mcp
  api_key_header: X-API-Key
  customer_id_header: X-Customer-ID
  session_id_header: X-Session-ID
crm:
  url: http://localhost:9000
observability:
  langfuse_enabled: true
